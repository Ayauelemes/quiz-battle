<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brain Battle - Кіру</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Brain Battle</h1>
  <nav>
    <a href="index.html">Басты бет</a>
    <a href="about.html">Біз туралы</a>
    <a href="services.html">Қызметтер</a>
    <a href="blog.html">Блог</a>
    <a href="contact.html">Байланыс</a>
    
    <span id="authLinks">
      <a href="login.html" class="active">Кіру</a>
      <a href="register.html">Тіркелу</a>
    </span>

    <span id="userSection" style="display: none; margin-left: 15px;">
      <span id="userName" style="color:white; font-weight: bold;"></span>
      <a href="#" onclick="logout()" style="color: #ff4d4d; margin-left: 10px;">Шығу</a>
    </span>
  </nav>
</header>

<main>
  <section class="contact">
    <h2>Жүйеге кіру</h2>

    <form onsubmit="event.preventDefault(); login();">
      <label for="loginEmail">Email:</label>
      <input type="email" id="loginEmail" placeholder="Email енгізіңіз" required>

      <label for="loginPassword">Құпиясөз:</label>
      <input type="password" id="loginPassword" placeholder="Құпиясөзді енгізіңіз" required>

      <button type="submit" class="btn">Кіру</button>
    </form>

    <p id="message" style="margin-top: 15px; font-weight: bold;"></p>
  </section>
</main>

<footer>
  <p>© 2026 Brain Battle</p>
</footer>

<script src="js/script.js"></script>


</body>
</html>
